<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style id="css">
/* Layout: the page is a drawing sheet. Title block header; Sheet 1 = the tool (the main project); later sheets = case studies of designs it produced from my briefs, each a large view plus a parts-list data table. Single deliberate light theme: white sheet, black linework, square corners, colour only from the images. */
:root{
  --sheet:#ffffff; --ink:#111111; --ink-2:#4a4a4a; --ink-3:#737373; --line:#111111; --hair:#cfcfcf; --tint:#f3f3f1; --mark:#1f5fbf;
  --draw:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sheet);color:var(--ink);font:18px/1.6 var(--text);margin:0}
.sheet{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(16px,4vw,40px) 0}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
h2,h3{text-wrap:balance}

/* title block */
.tb{border:2px solid var(--line);display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr);font-family:var(--draw)}
.tb > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 12px 10px;min-width:0}
.tb > div.r{border-right:0}
.tb > div.b{border-bottom:0}
.tb .l{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tb .v{display:block;font-size:16px;font-weight:500;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.tb .name{grid-row:span 3;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tb h1{font:700 clamp(2rem,6vw,3.3rem)/.95 var(--draw);margin:0;letter-spacing:-.01em;text-transform:uppercase}
.tb h1 > span{display:block}
.tb .wide{grid-column:span 2}
.email{user-select:all}
.copy{font:600 12px var(--draw);background:var(--sheet);color:var(--ink);border:1px solid var(--line);padding:1px 7px;margin-left:8px;cursor:pointer;vertical-align:1px}
.proj-sym{display:flex;align-items:center;gap:10px}
.proj-sym svg{flex:none}

.intro{margin-top:28px;max-width:62ch;font-size:1.15rem;line-height:1.55}
.intro ~ .intro{margin-top:12px;font-size:1.02rem;color:var(--ink-2)}

/* contents strip */
.toc{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));border:1px solid var(--line);font-family:var(--draw)}
.toc a{display:block;padding:8px 10px;border-right:1px solid var(--line);text-decoration:none;min-width:0}
.toc a:last-child{border-right:0}
.toc a:hover{background:var(--tint)}
.toc .l{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.toc .v{display:block;font-size:15px;font-weight:600;line-height:1.25}

/* views */
.view{margin-top:60px}
.vh{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.vh .tag{font:700 13px var(--draw);letter-spacing:.06em;text-transform:uppercase}
.vh h2{font:700 1.7rem/1.1 var(--draw);margin:0;text-transform:uppercase;letter-spacing:.01em}
.vh .scale{margin-left:auto;font:500 13px var(--draw);color:var(--ink-3)}
.vbody{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px 30px;margin-top:16px;align-items:start}
.vbody > *{min-width:0}
figure{margin:0;position:relative;min-width:0}
figure img{display:block;width:100%;height:auto;border:1px solid var(--hair)}
.stack > figure + figure{margin-top:18px}
figcaption{margin-top:7px;font:400 14px/1.45 var(--draw);color:var(--ink-2)}
figcaption b{font-weight:600;color:var(--ink)}
.desc{font-size:1.02rem}
.pl{width:100%;border-collapse:collapse;margin-top:16px;font-family:var(--draw);font-size:14.5px}
.pl caption{text-align:left;font:600 11px var(--draw);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px}
.pl th,.pl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.pl th{font-weight:500;color:var(--ink-2);width:52%}
.pl td{font-weight:600;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;font-size:1rem;border-left:3px solid var(--ink);padding:2px 0 2px 12px}
.more{margin-top:12px;font:600 14px var(--draw)}

/* who did what */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px;border:1px solid var(--line);font-family:var(--draw);font-size:15px;line-height:1.45}
.split.one{grid-template-columns:1fr}
.split > div{padding:10px 12px;min-width:0}
.split > div + div{border-left:1px solid var(--line)}
.split .l{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.split ul{margin:0;padding-left:18px}
.split li + li{margin-top:3px}

/* pipeline diagram */
.flow{margin-top:20px;overflow-x:auto;border:1px solid var(--line);background:var(--sheet)}
.flow svg{display:block;min-width:760px;width:100%;height:auto}
.flow text{font-family:var(--draw)}

.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 26px;margin-top:22px}
.cols3 > div{min-width:0;border-top:1px solid var(--line);padding-top:8px}
.cols3 h3{font:700 15px/1.25 var(--draw);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.cols3 p{font-size:.98rem;color:var(--ink-2)}

/* plates: supporting views */
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 26px;margin-top:28px;padding-top:18px;border-top:1px solid var(--hair)}
.plates.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.plates .span2{grid-column:span 2}
.plates.c3 .span2{grid-column:span 3}
.fn{font-weight:600;color:var(--ink);margin-right:6px}

/* tables */
.sub{margin-top:30px;font:700 13px var(--draw);letter-spacing:.06em;text-transform:uppercase}
.checks{overflow-x:auto;margin-top:8px}
.checks table{border-collapse:collapse;width:100%;min-width:560px;font-family:var(--draw);font-size:15px}
.checks th,.checks td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.checks th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.checks td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

/* lessons */
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
.notes li{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px}
.notes .k{font:700 15px/1.5 var(--draw);border:1px solid var(--line);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.notes h3{font:700 15.5px/1.35 var(--draw);margin:2px 0 3px}
.notes p{font-size:.97rem;color:var(--ink-2);grid-column:2}

footer{margin-top:64px;border-top:2px solid var(--line);padding-block:10px 36px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font:500 13px var(--draw);color:var(--ink-3)}

/* edit mode: blue pencil marks on the sheet */
.editing [data-p]{outline:1px dashed var(--mark);outline-offset:2px;cursor:text;min-width:2ch;display:inline-block}
.editing p[data-p],.editing h2[data-p],.editing h3[data-p],.editing li > [data-p]{display:block}
.editing [data-p]:focus{outline:2px solid var(--mark);background:var(--tint)}
.ctl{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin-right:6px;font:600 12px var(--draw)}
.ctl button,.ctl select,.add,#bar button{font:600 12px/1 var(--draw);border:1px solid var(--mark);background:var(--sheet);color:var(--mark);padding:4px 7px;cursor:pointer;border-radius:0}
.ctl select{max-width:180px;padding:3px 4px}
.ctl button:hover,.add:hover{background:var(--mark);color:var(--sheet)}
figure .ctl{position:absolute;top:6px;right:6px;z-index:2;justify-content:flex-end;margin:0;background:var(--sheet);padding:4px;border:1px solid var(--mark);max-width:calc(100% - 12px)}
.add{display:inline-block;margin-top:10px;border-style:dashed;padding:6px 10px}
.edit-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font:500 13px var(--draw);color:var(--mark)}
#bar{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--sheet);border:2px solid var(--ink);padding:8px 8px 8px 14px;font:500 13.5px/1.3 var(--draw);max-width:calc(100vw - 32px)}
#bar button{padding:8px 12px;font-size:13px;border-color:var(--ink);color:var(--ink)}
#bar .pri{background:var(--ink);color:var(--sheet)}
#bar button[disabled]{opacity:.45;cursor:default}
#bar .msg{color:var(--ink-2)}

@media (max-width:760px){
  .tb{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tb .name{grid-column:span 2;grid-row:auto;border-right:0}
  .tb > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .tb > div.r{border-right:1px solid var(--line)}
  .tb .wide{grid-column:span 2;border-right:0}
  .toc{grid-template-columns:1fr}
  .toc a{border-right:0;border-bottom:1px solid var(--line)}
  .toc a:last-child{border-bottom:0}
  .vbody,.split,.cols3,.notes{grid-template-columns:1fr}
  .split > div + div{border-left:0;border-top:1px solid var(--line)}
  .plates,.plates.c3{grid-template-columns:1fr}
  .plates .span2,.plates.c3 .span2{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function T(p,tag,cls){tag=tag||'span';var v=get(p);

  var cb=document.getElementById('copy-email');
  if(cb)cb.addEventListener('click',function(){var t=S.meta.email;
    function sel(){var r=document.createRange();r.selectNodeContents(document.querySelector('.email'));var x=getSelection();x.removeAllRanges();x.addRange(r);}
    try{navigator.clipboard.writeText(t).then(function(){cb.textContent='Copied';},function(){sel();cb.textContent='Selected';});}catch(err){sel();cb.textContent='Selected';}});
}

/* ---- editing ---- */
function markDirty(){dirty=true;try{sessionStorage.setItem('mae-draft',JSON.stringify(S));}catch(e){}bar();}
app.addEventListener('input',function(e){var el=e.target.closest('[data-p]');if(!el||!editing)return;setp(el.dataset.p,el.innerText.replace(/\n+$/,''));markDirty();});
app.addEventListener('keydown',function(e){var el=e.target.closest('[data-p]');if(el&&e.key==='Enter'&&!MULTI.test(el.dataset.p)){e.preventDefault();el.blur();}});
app.addEventListener('focusout',function(e){if(editing&&e.target.closest('[data-p]')&&/title|toc/.test(e.target.dataset.p||'')){var y=scrollY;render();scrollTo(0,y);}});
app.addEventListener('change',function(e){var s=e.target.closest('[data-sel]');if(!s)return;setp(s.dataset.sel,s.value);markDirty();render();});
app.addEventListener('click',function(e){
  if(!editing)return;
  if(e.target.closest('a'))e.preventDefault();
  var add=e.target.closest('[data-add]');
  if(add){get(add.dataset.add).push(JSON.parse(add.dataset.tpl));markDirty();render();return;}
  var up=e.target.closest('[data-up]');
  if(up){pick(up.dataset.up);return;}
  var btn=e.target.closest('.ctl button[data-a]');if(!btn)return;
  var c=btn.closest('.ctl'),arr=get(c.dataset.arr),i=+c.dataset.i,a=btn.dataset.a;
  if(a==='del')arr.splice(i,1);
  else if(a==='up'&&i>0)arr.splice(i-1,0,arr.splice(i,1)[0]);
  else if(a==='down'&&i<arr.length-1)arr.splice(i+1,0,arr.splice(i,1)[0]);
  markDirty();render();
});
function pick(path){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;msg='Uploading '+f.name+'…';bar();
    assets.upload(f).then(function(r){setp(path,'/_blob/'+r.id);msg='';markDirty();render();},
      function(err){msg='Upload failed ('+((err&&err.code)||'error')+'). Try a JPG or PNG under 20 MB.';bar();});};
  inp.click();
}

function build(){
  var json=JSON.stringify(S,null,1).replace(/</g,'\\u003c');
  var css=document.getElementById('css').textContent, js=document.getElementById('app-js').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    HEAD+'<style id="css">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="data">\n'+json+'\n<\/script>\n<script id="app-js">'+js+'<\/script>\n</body></html>';
}

var barEl=document.createElement('div');barEl.id='bar';barEl.hidden=true;document.body.appendChild(barEl);
function readDraft(){try{var d=sessionStorage.getItem('mae-draft');if(!d)return null;if(d===SRC||d===JSON.stringify(D)){sessionStorage.removeItem('mae-draft');return null;}return d;}catch(e){return null;}}
function bar(){
  if(!canEdit){barEl.hidden=true;return;}
  barEl.hidden=false;
  if(!editing){var draft=readDraft();
    barEl.innerHTML=(msg?'<span class="msg">'+esc(msg)+'</span>':'')+(draft?'<button type="button" data-b="restore">Restore unsaved edits</button>':'')+'<button type="button" class="pri" data-b="edit">Edit page</button>';
  }else{
    barEl.innerHTML='<span class="msg">'+esc(msg||(dirty?'Unsaved changes':'Click any blue-outlined text to edit · **word** makes it bold'))+'</span><button type="button" data-b="cancel">Cancel</button><button type="button" class="pri" data-b="save"'+(dirty?'':' disabled')+'>Save</button>';
  }
}
barEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-b]');if(!b)return;var k=b.dataset.b;
  if(k==='edit'){editing=true;msg='';render();bar();}
  else if(k==='restore'){var d=readDraft();if(d){S=JSON.parse(d);editing=true;dirty=true;render();bar();}}
  else if(k==='cancel'){S=JSON.parse(SRC);editing=false;dirty=false;msg='';try{sessionStorage.removeItem('mae-draft');}catch(e){}render();bar();}
  else if(k==='save'){save();}
});
function save(){
  barEl.innerHTML='<span class="msg">Saving…</span>';
  art.publish(build()).then(function(){try{sessionStorage.removeItem('mae-draft');}catch(e){}barEl.innerHTML='<span class="msg">Saved. Reloading…</span>';},function(err){
    var c=err&&err.code;
    if(c==='conflict'){msg='A newer version was saved elsewhere. The page is reloading; use Restore to get your edits back.';}
    else if(c==='not_writer'||c==='not_granted'){canEdit=false;editing=false;S=JSON.parse(SRC);render();}
    else{msg='Save failed ('+(c||'error')+'). Your edits are kept; try again.';}
    bar();
  });
}

render();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('artifact'),window.claude.use('user'),window.claude.use('assets')]).then(function(r){
    art=r[0];assets=r[2];var user=r[1];
    if(!art||!user)return false;
    return user.canEdit();
  }).then(function(ok){canEdit=!!ok;bar();}).catch(function(){});
}
})();
</script>

</body>
</html>
